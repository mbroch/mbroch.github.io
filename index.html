<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6ff">
  <title>Le coin de la famille</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #20263a;
      --muted: #65708a;
      --card: rgba(255, 255, 255, 0.88);
      --shadow: 0 14px 35px rgba(36, 49, 87, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      background:
        radial-gradient(ellipse at 10% 5%, #d8ecff 0, transparent 35%),
        radial-gradient(ellipse at 90% 15%, #fbe1f0 0, transparent 35%),
        linear-gradient(145deg, #f6f7ff, #eef7f5);
    }

    .page {
      width: min(1100px, calc(100% - 36px));
      margin: 0 auto;
      padding: 56px 0 40px;
    }

    header {
      margin-bottom: 34px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 13px;
      color: #525f86;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 650;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
    }

    .app-card {
      display: flex;
      min-height: 210px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      color: inherit;
      text-align: center;
      text-decoration: none;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .app-card:hover,
    .app-card:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 20px 42px rgba(36, 49, 87, 0.17);
    }

    .app-card:focus-visible,
    button:focus-visible,
    .open-link:focus-visible {
      outline: 3px solid #6778e8;
      outline-offset: 4px;
    }

    .app-card h2 {
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 12px;
      font-size: 1.13rem;
      line-height: 1.3;
    }

    .icon {
      display: grid;
      width: 112px;
      height: 112px;
      place-items: center;
      border-radius: 30px;
      font-size: 4.3rem;
      line-height: 1;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .weather { background: linear-gradient(145deg, #dff4ff, #a9dcff); }
    .typing  { background: linear-gradient(145deg, #fff0d9, #ffd294); }
    .three-d  { background: linear-gradient(145deg, #e7e1ff, #c5b8ff); }
    .rhino    { background: linear-gradient(145deg, #e0f5e9, #a8dec1); }
    .ebook    { background: linear-gradient(145deg, #ffe3e9, #ffb9c8); }

    .viewer {
      display: none;
      overflow: hidden;
      margin-top: 22px;
      background: white;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .viewer.active {
      display: block;
    }

    .viewer-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #edf0f7;
    }

    .viewer-title {
      margin: 0;
      font-size: 1rem;
    }

    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button,
    .open-link {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 9px 15px;
      color: #fff;
      background: #5968d8;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .open-link {
      color: #454f70;
      background: #eef0f8;
    }

    iframe {
      display: block;
      width: 100%;
      height: min(75vh, 820px);
      min-height: 520px;
      border: 0;
      background: #fff;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 24px, 430px);
        padding-top: 34px;
      }

      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }

      .app-card {
        min-height: 178px;
        padding: 18px 10px;
        border-radius: 20px;
      }

      .app-card h2 {
        font-size: 1rem;
      }

      .icon {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        font-size: 3.4rem;
      }

      iframe {
        min-height: 65vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <span class="eyebrow">Bienvenue chez nous ✨</span>
      <h1>Le coin de la famille</h1>
      <p class="intro">Choisissez une application pour commencer.</p>
    </header>

    <nav class="app-grid" id="menu" aria-label="Applications">
      <a class="app-card" href="/meteo-cosmos/" data-title="Météo Cosmos">
        <h2>Météo Cosmos</h2>
        <span class="icon weather" aria-hidden="true">🌤️</span>
      </a>

      <a class="app-card" href="/tape-touche/" data-title="Tape-Touche">
        <h2>Tape-Touche</h2>
        <span class="icon typing" aria-hidden="true">⌨️</span>
      </a>

      <a class="app-card" href="/Perestroika3D/" data-title="Perestroika 3D">
        <h2>Perestroika 3D</h2>
        <span class="icon three-d" aria-hidden="true">🪐</span>
      </a>

      <a class="app-card" href="/rhino-dev/" data-title="Rhino Dev">
        <h2>Rhino Dev</h2>
        <span class="icon rhino" aria-hidden="true">🦏</span>
      </a>

      <a class="app-card" href="/LecteurEpub/" data-title="Lecteur ePub">
        <h2>Lecteur ePub</h2>
        <span class="icon ebook" aria-hidden="true">📚</span>
      </a>
    </nav>

    <section class="viewer" id="viewer" aria-label="Application ouverte">
      <div class="viewer-bar">
        <h2 class="viewer-title" id="viewerTitle">Application</h2>
        <div class="viewer-actions">
          <a class="open-link" id="openLink" href="#" target="_blank"
             rel="noopener">Ouvrir dans un nouvel onglet ↗</a>
          <button type="button" id="backButton">← Retour au menu</button>
        </div>
      </div>
      <iframe id="appFrame" title="Application sélectionnée"></iframe>
    </section>

    <footer>Un petit espace pour nos applications préférées 💛</footer>
  </main>

  <script>
    const menu = document.getElementById("menu");
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("appFrame");
    const viewerTitle = document.getElementById("viewerTitle");
    const openLink = document.getElementById("openLink");
    const backButton = document.getElementById("backButton");

    menu.addEventListener("click", (event) => {
      const card = event.target.closest("a[data-title]");
      if (!card) return;

      event.preventDefault();

      const url = card.getAttribute("href");
      viewerTitle.textContent = card.dataset.title;
      frame.title = card.dataset.title;
      frame.src = url;
      openLink.href = url;

      menu.hidden = true;
      viewer.classList.add("active");
      viewer.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    backButton.addEventListener("click", () => {
      frame.src = "about:blank";
      viewer.classList.remove("active");
      menu.hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
